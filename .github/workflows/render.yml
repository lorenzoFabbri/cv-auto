name: Render CV

on:
  push:
    branches: [main]
  schedule:
    # Every Monday at 08:00 UTC; the gate job below keeps only the first of the
    # month. Cron ORs day-of-month with day-of-week, so "1-7 * 1" would fire on
    # days 1-7 *and* every Monday.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── 0. First-Monday gate ────────────────────────────────────────────────
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%-d)" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. Lint & format ────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v7

      # Pinned so a new air release cannot reformat code and fail the check;
      # bump together with the local install.
      - uses: posit-dev/setup-air@v1
        with:
          version: "0.12.0"

      - name: Check formatting with air
        run: air format --check R/

      # lintr needs none of the project packages (object_usage_linter is off),
      # so this job skips renv entirely.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"
          use-public-rspm: true

      - name: Install lintr
        run: Rscript -e "install.packages('lintr')"

      # error_on_lint only takes effect as an env var: lint_dir() resets the
      # .lintr settings before the lints are printed.
      - name: Lint with lintr
        run: Rscript -e "lintr::lint_dir('R/')"
        env:
          LINTR_ERROR_ON_LINT: true

  # ── 2. Render all formats ───────────────────────────────────────────────
  render:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      # GitHub evicts caches unused for 7 days, so a monthly run never hits one.
      - uses: r-lib/actions/setup-renv@v2
        with:
          bypass-cache: true

      # No system-font install needed — Liberation Sans is vendored in fonts/
      # and resolved via the typst font-paths setting in _quarto.yml.
      - name: Render CV (HTML + PDF + DOCX)
        run: quarto render
        env:
          QUARTO_PRINT_STACK: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      - name: Upload PDF and DOCX as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cv-outputs
          path: |
            docs/cv-*.pdf
            docs/cv-*.docx

  # ── 3. Deploy to GitHub Pages ───────────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: render
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
